[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcv-project"
version = "0.1.0"
description = "Python implementation for the PCV final project"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "matplotlib",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
